<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatBuddy Songbook</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background:#111; color:#eee; }
  header { position:sticky; top:0; z-index:2; background:#111; padding:10px 10px 8px; border-bottom:1px solid #333; }
  #bar { display:flex; gap:6px; align-items:center; }
  #status { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:17px; font-weight:700; padding:10px 12px; border-radius:12px; background:#333; min-height:48px;
            display:flex; align-items:center; }
  #status.ok { background:#1b5e20; } #status.warn { background:#8a6d00; } #status.err { background:#8b1a1a; }
  #connect { font-size:17px; font-weight:700; padding:12px 12px; white-space:nowrap; border-radius:12px; border:0; background:#1565c0; color:#fff; min-height:48px; }
  #q { width:100%; margin-top:8px; font-size:20px; padding:12px 14px; border-radius:12px; border:1px solid #444; background:#1d1d1d; color:#fff; }
  #msg { font-size:16px; margin-top:6px; color:#ddd; white-space:pre-line; }
  #msg a { color:#ffb74d; font-weight:700; }
  #opts { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; font-size:15px; color:#aaa; }
  #outputs { font-size:15px; padding:6px; border-radius:8px; max-width:60vw; }
  #list { list-style:none; margin:0; padding:6px 8px 40px; }
  #list li { margin:0 0 6px; }
  .song { width:100%; text-align:left; border:0; border-radius:14px; background:#222; color:#eee; padding:14px 14px; min-height:64px;
          display:block; font:inherit; cursor:pointer; }
  .song:active { background:#0d47a1; }
  .song.sent { background:#1b5e20; }
  .t { font-size:21px; font-weight:700; display:block; }
  .m { font-size:14px; color:#aaa; display:block; margin-top:3px; }
  .notab { color:#ffb74d; }
  #count { font-size:13px; color:#888; padding:0 12px; }
  #startdelay { font-size:15px; padding:6px; border-radius:8px; }
  #startdelay:disabled { opacity:.5; }
  #stop, #start { font-size:17px; font-weight:700; padding:12px 12px; border-radius:12px; border:0; color:#fff; min-height:48px; min-width:48px; white-space:nowrap; }
  #stop { background:#b71c1c; }
  #stop:active { background:#7f0000; }
  #start { background:#2e7d32; }
  #start:active { background:#1b5e20; }
  #start.off { opacity:.45; filter:grayscale(.6); }
  .stopnote { font-size:12px; color:#ef9a9a; }
  .startnote { font-size:12px; color:#a5d6a7; }
  /* Live tempo: fixed to the bottom so the targets stay under the thumb while the list scrolls. */
  #tempo { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; gap:8px; align-items:stretch;
           padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:#0e0e0e; border-top:1px solid #333;
           box-shadow:0 -6px 16px rgba(0,0,0,.45); }
  #tempo[hidden] { display:none !important; }
  #bpm-minus, #bpm-plus { flex:1 1 0; min-width:72px; min-height:84px; font-size:48px; font-weight:800; line-height:1;
           border:0; border-radius:16px; color:#fff; touch-action:manipulation; }
  #bpm-minus { background:#37474f; }
  #bpm-minus:active { background:#263238; }
  #bpm-plus { background:#1565c0; }
  #bpm-plus:active { background:#0d47a1; }
  #bpm-readout { flex:1.3 1 0; min-width:0; min-height:84px; display:flex; flex-direction:column; align-items:center;
           justify-content:center; background:#1b1b1b; border-radius:16px; padding:6px 8px; }
  #bpm-value { font-size:36px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  #bpm-unit { font-size:12px; font-weight:700; letter-spacing:.06em; color:#9e9e9e; margin-top:2px; }
  #bpm-caption { font-size:12px; color:#bbb; margin-top:2px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bpm-caption.default { color:#ffb74d; font-weight:700; }
  body.has-tempo #list { padding-bottom:140px; }
  @media (max-width:520px) { #bar #stop, #bar #start, #bar #connect { font-size:16px; padding:12px 9px; } }
</style>
</head>
<body>
<header>
  <div id="bar"><div id="status">Starting…</div><button id="connect" type="button">Connect MIDI</button><button id="stop" type="button" title="Sends MIDI Stop (0xFC) — stops immediately">■ Stop beat</button><button id="start" type="button" class="off" title="Sends CC114 = 1 — starts the loaded song">▶ Start beat</button></div>
  <input id="q" type="search" placeholder="Search songs, artists, beats…" autocomplete="off">
  <div id="msg"></div>
  <div id="opts">
    <label>Output <select id="outputs"><option value="">(no MIDI outputs yet)</option></select></label>
    <label><input type="checkbox" id="opentabs" checked> Open tab on tap</label>
    <label><input type="checkbox" id="autostart"> Auto-start beat</label>
    <label>Start after <select id="startdelay">
      <option value="300">300 ms</option><option value="600" selected>600 ms</option><option value="1000">1000 ms</option>
      <option value="1500">1500 ms</option><option value="2000">2000 ms</option></select></label>
    <span class="stopnote">■ Stop beat stops immediately</span>
    <span class="startnote">▶ Start beat starts the loaded song</span>
  </div>
</header>
<div id="count"></div>
<ul id="list"></ul>
<div id="tempo" hidden role="group" aria-label="Tempo">
  <button id="bpm-minus" type="button" aria-label="Decrease tempo by 1 BPM">−</button>
  <div id="bpm-readout">
    <div id="bpm-value" aria-live="polite">120</div>
    <div id="bpm-unit">BPM</div>
    <div id="bpm-caption"></div>
  </div>
  <button id="bpm-plus" type="button" aria-label="Increase tempo by 1 BPM">+</button>
</div>
<script type="application/json" id="songs-data">
__SONGS_JSON__
</script>

<script>
/*
 * BeatBuddy songbook: one tap = send the song (and tempo) to BeatBuddy via Web MIDI AND open its saved tab.
 * Same MIDI as index.html: CC0 bank, CC32 = folder-1, Program Change = song-1, then after `delay` ms
 * CC106 = floor(bpm/128), CC107 = bpm % 128.
 * window.open() is called synchronously inside the tap handler (after the synchronous song-select sends,
 * before the tempo timer) so Chrome treats it as user-initiated and doesn't block it.
 * URL params: out=TEXT (preferred output name, default WIDI), ch=1-16, delay=MS (default 400).
 *
 * Optional "Auto-start beat" (checkbox, OFF by default, remembered in localStorage bb_autostart / bb_startdelay):
 * after the tempo, wait "Start after" ms (300, 600 = default, 1000, 1500, 2000) and send CC114 value 1 = "Start playback of
 * the current song". With no bpm the start goes delay + startDelay after the song select (default 400+600 = 1000 ms).
 * A new tap (or Stop) cancels any tempo/start still pending from the previous tap, so a stale start never fires.
 * "Stop beat" sends MIDI System Real Time Stop (0xFC); MIDI-IN > Stop is Enabled by default (manual p.41).
 * "Start beat" sends CC114 value 1 (Bn 72 01, same message as auto-start) on the selected channel, after cancelling any
 * pending tempo/auto-start timer so nothing is sent twice. Works whether or not Auto-start is ticked.
 *
 * Live tempo, after a song is selected: one − and one + change the tempo by exactly 1 BPM (clamped to 40–300)
 * and send only the same tempo pair the song tap uses — CC106 = floor(bpm/128) then CC107 = bpm % 128 — on the
 * page's MIDI channel (URL ch=, default 1). BeatBuddy applies the tempo when the LSB arrives and ignores a tempo
 * outside 40–300 (manual firmware 4.1.6, "Tempo MSB & Tempo LSB"). The buttons do not resend the song, do not
 * send Start or Stop, and do not cancel a pending tempo or auto-start, so the beat keeps playing.
 * A song with no bpm shows 120, labeled "no saved BPM", until − or + is pressed (the song tap itself still
 * sends no tempo, same as before). Tapping a song loads that song's own bpm again.
 */
(function (global) {
  'use strict';
  function buildSongMessages(song, ch) {
    var c = (ch || 1) - 1;
    var sel = [[0xB0 | c, 0x00, 0], [0xB0 | c, 0x20, song.folder - 1], [0xC0 | c, song.songnum - 1]];
    var tempo = null;
    if (song.bpm != null && song.bpm >= 40 && song.bpm <= 300) tempo = [[0xB0 | c, 106, Math.floor(song.bpm / 128)], [0xB0 | c, 107, song.bpm % 128]];
    return { select: sel, tempo: tempo, start: [0xB0 | c, 114, 1] };
  }
  function pickOutput(outputs, pref) {
    if (!outputs.length) return null;
    var want = (pref || '').toLowerCase();
    if (want) for (var i = 0; i < outputs.length; i++) if ((outputs[i].name || '').toLowerCase().indexOf(want) !== -1) return outputs[i];
    return outputs[0];
  }
  function safeTab(url) {
    try { var u = new URL(url); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null; } catch (e) { return null; }
  }
  function sortSongs(songs) {
    return songs.slice().sort(function (a, b) {
      return a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }) || (a.artist || '').localeCompare(b.artist || '', 'en', { sensitivity: 'base' });
    });
  }
  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function filterSongs(songs, q) {
    var words = norm(q).split(' ').filter(Boolean);
    if (!words.length) return songs;
    return songs.filter(function (s) {
      var hay = norm(s.title + ' ' + s.artist + ' ' + s.bb + ' f' + s.folder + ' s' + s.songnum);
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    });
  }
  /*
   * The one-tap action. Order matters:
   *   1. out.send() bank + folder + Program Change (synchronous)
   *   2. window.open(tab, '_blank') — still inside the user's tap, so not popup-blocked
   *   3. setTimeout(delay) → tempo CC106 + CC107
   *   4. only if env.autoStart: setTimeout(startDelay) after the tempo → CC114 value 1
   *      (no tempo: one timer of delay + startDelay after the song select)
   * env = { out, win, setTimeout, clearTimeout, ch, delay, openTabs, autoStart, startDelay, onTempo, onStart, tempoNow }
   * tempoNow(), if set, is read when the delayed tempo is sent. A live ±1 nudge updates it so the queued
   * tempo follows the buttons without cancelling the timer (and without cancelling a chained auto-start).
   * Returns r with r.cancel(): clears whatever tempo/start timer is still pending (used on the next tap / Stop).
   */
  function tapSong(song, env) {
    var m = buildSongMessages(song, env.ch);
    var r = { sent: false, opened: false, tab: safeTab(song.tab || ''), startAt: null, cancelled: false, cancel: function () {} };
    if (!env.out) return r;
    var timer = null;
    function later(fn, ms) { timer = env.setTimeout(function () { timer = null; if (!r.cancelled) fn(); }, ms); }
    r.cancel = function () { r.cancelled = true; if (timer !== null && env.clearTimeout) env.clearTimeout(timer); timer = null; };
    function start() { env.out.send(m.start); if (env.onStart) env.onStart(); }
    var sd = env.startDelay != null ? env.startDelay : 600;
    m.select.forEach(function (b) { env.out.send(b); });
    r.sent = true;
    if (r.tab && env.openTabs) { env.win.open(r.tab, '_blank'); r.opened = true; }
    if (m.tempo) {
      later(function () {
        var bytes = m.tempo;
        if (env.tempoNow) { var now = env.tempoNow(); if (now != null) bytes = tempoMessages(now, env.ch); }
        bytes.forEach(function (b) { env.out.send(b); }); if (env.onTempo) env.onTempo();
        if (env.autoStart) later(start, sd);
      }, env.delay);
      if (env.autoStart) r.startAt = env.delay + sd;
    } else if (env.autoStart) {
      later(start, env.delay + sd); r.startAt = env.delay + sd;
    }
    return r;
  }
  /*
   * Manual "Start beat": env = { out, ch, cancel }. Always calls cancel() first (pending tempo/auto-start),
   * then sends CC114 = 1 on channel ch if there is an output. Returns { sent, bytes }.
   */
  function startBeat(env) {
    if (env.cancel) env.cancel();
    var bytes = buildSongMessages({ folder: 1, songnum: 1 }, env.ch).start;
    if (!env.out) return { sent: false, bytes: bytes };
    env.out.send(bytes);
    return { sent: true, bytes: bytes };
  }
  var STOP = [0xFC];   // MIDI System Real Time Stop (channel-less)
  var START_DELAYS = [300, 600, 1000, 1500, 2000];
  var BPM_MIN = 40, BPM_MAX = 300, BPM_DEFAULT = 120;
  function clampBpm(bpm) {
    var n = Math.round(Number(bpm));
    if (!isFinite(n)) return BPM_DEFAULT;
    if (n < BPM_MIN) return BPM_MIN;
    if (n > BPM_MAX) return BPM_MAX;
    return n;
  }
  // Songs with a usable bpm keep it. Anything else (missing, blank, out of range) starts the live control at 120.
  function initialBpm(song) {
    if (song && song.bpm != null && song.bpm >= BPM_MIN && song.bpm <= BPM_MAX) return { bpm: song.bpm, isDefault: false };
    return { bpm: BPM_DEFAULT, isDefault: true };
  }
  // CC106 (MSB) then CC107 (LSB). BPM = MSB * 128 + LSB. Status byte uses the same channel as song select.
  function tempoMessages(bpm, ch) {
    var c = (ch || 1) - 1;
    var n = clampBpm(bpm);
    return [[0xB0 | c, 106, Math.floor(n / 128)], [0xB0 | c, 107, n % 128]];
  }
  // Exactly one BPM. Other deltas are ignored so the buttons cannot jump.
  function nudgeTempo(bpm, delta) {
    var cur = clampBpm(bpm);
    if (delta !== 1 && delta !== -1) return cur;
    return clampBpm(cur + delta);
  }
  var api = { buildSongMessages: buildSongMessages, pickOutput: pickOutput, safeTab: safeTab, sortSongs: sortSongs,
              filterSongs: filterSongs, tapSong: tapSong, startBeat: startBeat, STOP: STOP, START_DELAYS: START_DELAYS,
              BPM_MIN: BPM_MIN, BPM_MAX: BPM_MAX, BPM_DEFAULT: BPM_DEFAULT,
              clampBpm: clampBpm, initialBpm: initialBpm, tempoMessages: tempoMessages, nudgeTempo: nudgeTempo };
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; return; }
  global.BBSongs = api;

  // ---------------- Browser UI ----------------
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  function intP(n, d, lo, hi) { var v = Number(params.get(n)); return (params.get(n) !== null && Number.isInteger(v) && v >= lo && v <= hi) ? v : d; }
  var PREF = (params.get('out') || 'WIDI').trim(), CH = intP('ch', 1, 1, 16), DELAY = intP('delay', 400, 0, 5000);
  var SONGS = sortSongs(JSON.parse($('songs-data').textContent));
  var access = null, outputs = [], userPicked = false, lastTap = 0, pending = null, live = null;

  try { var saved = localStorage.getItem('bb_opentabs'); if (saved !== null) $('opentabs').checked = saved === '1'; } catch (e) {}
  $('opentabs').addEventListener('change', function () { try { localStorage.setItem('bb_opentabs', this.checked ? '1' : '0'); } catch (e) {} });
  try {
    if (localStorage.getItem('bb_autostart') === '1') $('autostart').checked = true;
    var sdv = Number(localStorage.getItem('bb_startdelay'));
    if (START_DELAYS.indexOf(sdv) !== -1) $('startdelay').value = String(sdv);
  } catch (e) {}
  function syncStartUI() { $('startdelay').disabled = !$('autostart').checked; }
  syncStartUI();
  $('autostart').addEventListener('change', function () { syncStartUI(); try { localStorage.setItem('bb_autostart', this.checked ? '1' : '0'); } catch (e) {} });
  $('startdelay').addEventListener('change', function () { try { localStorage.setItem('bb_startdelay', this.value); } catch (e) {} });
  function cancelPending() { if (pending) { pending.cancel(); pending = null; } }

  function setStatus(t, cls) { $('status').textContent = t; $('status').title = t; $('status').className = cls || ''; }
  function setMsg(text, link) {
    var el = $('msg'); el.textContent = text || '';
    if (link) { el.appendChild(document.createTextNode(' ')); var a = document.createElement('a'); a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open tab anyway'; el.appendChild(a); }
  }
  function isPreferred(o) { return !!o && (o.name || '').toLowerCase().indexOf(PREF.toLowerCase()) !== -1; }

  function refreshOutputs() {
    outputs = [];
    if (access) access.outputs.forEach(function (o) { if (o.state !== 'disconnected') outputs.push(o); });
    var sel = $('outputs'), prev = sel.value;
    sel.innerHTML = '';
    if (!outputs.length) { sel.innerHTML = '<option value="">(no MIDI outputs found)</option>'; showConn(); return; }
    var preferred = pickOutput(outputs, PREF);
    outputs.forEach(function (o) { var opt = document.createElement('option'); opt.value = o.id; opt.textContent = o.name; sel.appendChild(opt); });
    var keep = outputs.some(function (o) { return o.id === prev; }) && (userPicked || !isPreferred(preferred));
    sel.value = keep ? prev : preferred.id;
    showConn();
  }
  function currentOutput() {
    var id = $('outputs').value;
    for (var i = 0; i < outputs.length; i++) if (outputs[i].id === id) return outputs[i];
    return null;
  }
  // Usable = the preferred (WIDI) output, or any output the user picked by hand.
  function usableOutput() { var o = currentOutput(); return o && (isPreferred(o) || userPicked) ? o : null; }
  function showConn() {
    var o = usableOutput();
    $('start').classList.toggle('off', !o); $('start').setAttribute('aria-disabled', o ? 'false' : 'true');
    if (o) { setStatus('✓ ' + o.name, 'ok'); $('connect').style.display = 'none'; }
    else if (!access) { setStatus('MIDI not connected', 'err'); $('connect').style.display = ''; }
    else {
      setStatus('"' + PREF + '" not found', 'err'); $('connect').style.display = '';
      setMsg('Connect WIDI Master in "MIDI BLE Connect" (Bluetooth Scan → WIDI Master), press Home, come back. ' +
             (outputs.length ? 'Or pick an output above.' : ''));
    }
  }

  async function connect() {
    if (!window.isSecureContext) { setStatus('Needs HTTPS', 'err'); return; }
    if (!navigator.requestMIDIAccess) { setStatus('Web MIDI not available', 'err'); setMsg('Open this page in Chrome on Android.'); return; }
    if (!access) {
      setStatus('Asking for MIDI permission…', 'warn');
      try { access = await navigator.requestMIDIAccess({ sysex: false }); }
      catch (e) { setStatus('MIDI permission blocked', 'err'); setMsg('Chrome ⋮ → Settings → Site settings → MIDI devices → allow, then reload.'); return; }
      access.onstatechange = function () { refreshOutputs(); if (usableOutput()) setMsg(''); };
    }
    refreshOutputs();
    if (usableOutput()) setMsg('');
  }

  function render() {
    var list = filterSongs(SONGS, $('q').value), ul = $('list');
    ul.innerHTML = '';
    var frag = document.createDocumentFragment();
    list.forEach(function (s) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.className = 'song'; b.dataset.key = s.key;
      var t = document.createElement('span'); t.className = 't'; t.textContent = s.title;
      var m = document.createElement('span'); m.className = 'm';
      m.textContent = (s.artist ? s.artist + ' · ' : '') + 'F' + s.folder + ' S' + s.songnum + ' ' + s.bb + (s.bpm ? ' · ' + s.bpm + ' BPM' : '');
      if (!safeTab(s.tab || '')) { var n = document.createElement('span'); n.className = 'notab'; n.textContent = ' · no tab saved'; m.appendChild(n); }
      b.appendChild(t); b.appendChild(m);
      b.addEventListener('click', function () { onTap(s, b); });
      li.appendChild(b); frag.appendChild(li);
    });
    ul.appendChild(frag);
    $('count').textContent = list.length + ' of ' + SONGS.length + ' songs';
  }

  function renderTempo() {
    var bar = $('tempo');
    if (!live) { bar.hidden = true; document.body.classList.remove('has-tempo'); return; }
    $('bpm-value').textContent = String(live.bpm);
    var cap = $('bpm-caption');
    if (live.isDefault) {
      cap.textContent = 'no saved BPM';
      cap.className = 'default';
      cap.title = live.title + ' has no saved BPM — starting at ' + live.bpm;
    } else {
      cap.textContent = live.title;
      cap.className = '';
      cap.title = live.title + ' · ' + live.bpm + ' BPM';
    }
    bar.hidden = false;
    document.body.classList.add('has-tempo');
  }
  function onTempoStep(delta) {
    if (!live) return;
    var next = nudgeTempo(live.bpm, delta);
    var link = live.tab && !live.opened ? live.tab : null;
    if (next === live.bpm) { setMsg(live.title + ' · tempo stays at ' + live.bpm + ' BPM', link); return; }
    var out = usableOutput();
    if (!out) { connect(); setMsg('Tempo NOT sent — no BeatBuddy MIDI connection.'); return; }
    try { tempoMessages(next, CH).forEach(function (b) { out.send(b); }); }
    catch (e) { setStatus('Send failed', 'err'); setMsg(String(e && e.message || e)); return; }
    live.bpm = next;
    live.isDefault = false;
    renderTempo();
    setMsg(live.title + ' · ' + live.bpm + ' BPM', link);
  }

  function onTap(song, btn) {
    var now = Date.now(); if (now - lastTap < 500) return; lastTap = now;   // ignore double taps
    cancelPending();   // a pending tempo/start from the previous tap must never fire for the wrong song
    var out = usableOutput();
    if (!out) {
      connect();
      setMsg('Not sent — no BeatBuddy MIDI connection. ' + song.title + ' was NOT sent.', safeTab(song.tab || ''));
      return;
    }
    var r, auto = $('autostart').checked, sd = Number($('startdelay').value) || 600;
    var base = 'Sent: ' + song.title + ' → F' + song.folder + ' S' + song.songnum + (song.bpm ? ', ' + song.bpm + ' BPM' : '');
    try {
      r = tapSong(song, { out: out, win: window, setTimeout: setTimeout.bind(window), clearTimeout: clearTimeout.bind(window), ch: CH, delay: DELAY,
                          openTabs: $('opentabs').checked, autoStart: auto, startDelay: sd,
                          tempoNow: function () { return live && live.key === song.key ? live.bpm : null; },
                          onStart: function () {
                            if (pending !== r) return;
                            pending = null;
                            // If −/+ already moved the tempo, say that BPM. A song with no saved tempo
                            // still has not sent one, so the start line stays as it was.
                            var shown = (live && live.key === song.key && !live.isDefault) ? live.bpm : song.bpm;
                            var line = 'Sent: ' + song.title + ' → F' + song.folder + ' S' + song.songnum +
                              (shown ? ', ' + shown + ' BPM' : '') + ' · ▶ Start sent';
                            setMsg(line, live && live.tab && !live.opened ? live.tab : null);
                          } });
      pending = r;
      var init = initialBpm(song);
      live = { key: song.key, title: song.title, bpm: init.bpm, isDefault: init.isDefault, tab: r.tab, opened: r.opened };
      renderTempo();
    } catch (e) { setStatus('Send failed', 'err'); setMsg(String(e && e.message || e)); return; }
    Array.prototype.forEach.call(document.querySelectorAll('.song.sent'), function (x) { x.classList.remove('sent'); });
    btn.classList.add('sent');
    setMsg(base + (auto ? ' · starting in ' + r.startAt + ' ms' : '') +
           (r.tab ? (r.opened ? '' : ' · tab not opened (setting off)') : ' · no tab saved'), r.tab && !r.opened ? r.tab : null);
  }

  $('q').addEventListener('input', render);
  $('connect').addEventListener('click', connect);
  $('stop').addEventListener('click', function () {
    cancelPending();
    var out = usableOutput();
    if (!out) { connect(); setMsg('Stop NOT sent — no BeatBuddy MIDI connection.'); return; }
    try { out.send(STOP); setMsg('■ Stop sent (MIDI Stop 0xFC)'); } catch (e) { setStatus('Send failed', 'err'); setMsg(String(e && e.message || e)); }
  });
  $('start').addEventListener('click', function () {
    var out = usableOutput();
    try {
      var r = startBeat({ out: out, ch: CH, cancel: cancelPending });   // cancels pending tempo/auto-start first
      if (!r.sent) { connect(); setMsg('▶ Start NOT sent — no BeatBuddy MIDI connection.'); return; }
      setMsg('▶ Start sent');
    } catch (e) { setStatus('Send failed', 'err'); setMsg(String(e && e.message || e)); }
  });
  $('bpm-minus').addEventListener('click', function () { onTempoStep(-1); });
  $('bpm-plus').addEventListener('click', function () { onTempoStep(1); });
  $('outputs').addEventListener('change', function () { userPicked = true; showConn(); });
  render();
  connect();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
