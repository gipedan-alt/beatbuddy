  .m { font-size:14px; color:#aaa; display:block; margin-top:3px; }

  #count { font-size:13px; color:#888; padding:0 12px; }
  #startdelay { font-size:15px; padding:6px; border-radius:8px; }
  #startdelay:disabled { opacity:.5; }
  #stop { font-size:17px; font-weight:700; padding:12px 14px; border-radius:12px; border:0; background:#b71c1c; color:#fff; min-height:48px; }

  .stopnote { font-size:12px; color:#ef9a9a; }
</style>

/*
 * BeatBuddy songbook: one tap = send the song (and tempo) to BeatBuddy via Web MIDI AND open its saved tab.
 * Same MIDI as index.html: CC0 bank, CC32 = folder-1, Program Change = song-1, then after `delay` ms
 * CC106 = floor(bpm/128), CC107 = bpm % 128.
 * window.open() is called synchronously inside the tap handler (after the synchronous song-select sends,
 * before the tempo timer) so Chrome treats it as user-initiated and doesn't block it.
 * URL params: out=TEXT (preferred output name, default WIDI), ch=1-16, delay=MS (default 400).
 *
 * Optional "Auto-start beat" (checkbox, OFF by default, remembered in localStorage bb_autostart / bb_startdelay):
 * after the tempo, wait "Start after" ms (300, 600 = default, 1000, 1500, 2000) and send CC114 value 1 = "Start playback of
 * the current song". With no bpm the start goes delay + startDelay after the song select (default 400+600 = 1000 ms).
 * A new tap (or Stop) cancels any tempo/start still pending from the previous tap, so a stale start never fires.
 * "Stop beat" sends MIDI System Real Time Stop (0xFC); MIDI-IN > Stop is Enabled by default (manual p.41).

  var params = new URLSearchParams(location.search);
  function intP(n, d, lo, hi) { var v = Number(params.get(n)); return (params.get(n) !== null && Number.isInteger(v) && v >= lo && v <= hi) ? v : d; }
  var PREF = (params.get('out') || 'WIDI').trim(), CH = intP('ch', 1, 1, 16), DELAY = intP('delay', 400, 0, 5000);
  var SONGS = sortSongs(JSON.parse($('songs-data').textContent));
  var access = null, outputs = [], userPicked = false, lastTap = 0, pending = null;

  try { var saved = localStorage.getItem('bb_opentabs'); if (saved !== null) $('opentabs').checked = saved === '1'; } catch (e) {}
  $('opentabs').addEventListener('change', function () { try { localStorage.setItem('bb_opentabs', this.checked ? '1' : '0'); } catch (e) {} });
  try {
    if (localStorage.getItem('bb_autostart') === '1') $('autostart').checked = true;
    var sdv = Number(localStorage.getItem('bb_startdelay'));
    if (START_DELAYS.indexOf(sdv) !== -1) $('startdelay').value = String(sdv);
  } catch (e) {}
  function syncStartUI() { $('startdelay').disabled = !$('autostart').checked; }
  syncStartUI();
  $('autostart').addEventListener('change', function () { syncStartUI(); try { localStorage.setItem('bb_autostart', this.checked ? '1' : '0'); } catch (e) {} });
  $('startdelay').addEventListener('change', function () { try { localStorage.setItem('bb_startdelay', this.value); } catch (e) {} });
  function cancelPending() { if (pending) { pending.cancel(); pending = null; } }

  function setStatus(t, cls) { $('status').textContent = t; $('status').className = cls || ''; }
  function setMsg(text, link) {
    var el = $('msg'); el.textContent = text || '';
    if (link) { el.appendChild(document.createTextNode(' ')); var a = document.createElement('a'); a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open tab anyway'; el.appendChild(a); }
  }
  function isPreferred(o) { return !!o && (o.name || '').toLowerCase().indexOf(PREF.toLowerCase()) !== -1; }

  function refreshOutputs() {
    outputs = [];
    if (access) access.outputs.forEach(function (o) { if (o.state !== 'disconnected') outputs.push(o); });
    var sel = $('outputs'), prev = sel.value;
    sel.innerHTML = '';
    if (!outputs.length) { sel.innerHTML = '<option value="">(no MIDI outputs found)</option>'; showConn(); return; }
    var preferred = pickOutput(outputs, PREF);
    outputs.forEach(function (o) { var opt = document.createElement('option'); opt.value = o.id; opt.textContent = o.name; sel.appendChild(opt); });
    var keep = outputs.some(function (o) { return o.id === prev; }) && (userPicked || !isPreferred(preferred));
    sel.value = keep ? prev : preferred.id;
    showConn();
  }
  function currentOutput() {
    var id = $('outputs').value;
    for (var i = 0; i < outputs.length; i++) if (outputs[i].id === id) return outputs[i];
    return null;
  }
  // Usable = the preferred (WIDI) output, or any output the user picked by hand.
  function usableOutput() { var o = currentOutput(); return o && (isPreferred(o) || userPicked) ? o : null; }
  function showConn() {
    var o = usableOutput();
    if (o) { setStatus('✓ ' + o.name, 'ok'); $('connect').style.display = 'none'; }
    else if (!access) { setStatus('MIDI not connected', 'err'); $('connect').style.display = ''; }
    else {
      setStatus('"' + PREF + '" not found', 'err'); $('connect').style.display = '';
      setMsg('Connect WIDI Master in "MIDI BLE Connect" (Bluetooth Scan → WIDI Master), press Home, come back. ' +
             (outputs.length ? 'Or pick an output above.' : ''));
    }
  }

  async function connect() {
    if (!window.isSecureContext) { setStatus('Needs HTTPS', 'err'); return; }
    if (!navigator.requestMIDIAccess) { setStatus('Web MIDI not available', 'err'); setMsg('Open this page in Chrome on Android.'); return; }
    if (!access) {
      setStatus('Asking for MIDI permission…', 'warn');
      try { access = await navigator.requestMIDIAccess({ sysex: false }); }
      catch (e) { setStatus('MIDI permission blocked', 'err'); setMsg('Chrome ⋮ → Settings → Site settings → MIDI devices → allow, then reload.'); return; }
      access.onstatechange = function () { refreshOutputs(); if (usableOutput()) setMsg(''); };
    }
    refreshOutputs();
    if (usableOutput()) setMsg('');
  }

  function render() {
    var list = filterSongs(SONGS, $('q').value), ul = $('list');
    ul.innerHTML = '';
    var frag = document.createDocumentFragment();
    list.forEach(function (s) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.className = 'song'; b.dataset.key = s.key;
      var t = document.createElement('span'); t.className = 't'; t.textContent = s.title;
      var m = document.createElement('span'); m.className = 'm';
      m.textContent = (s.artist ? s.artist + ' · ' : '') + 'F' + s.folder + ' S' + s.songnum + ' ' + s.bb + (s.bpm ? ' · ' + s.bpm + ' BPM' : '');
      if (!safeTab(s.tab || '')) { var n = document.createElement('span'); n.className = 'notab'; n.textContent = ' · no tab saved'; m.appendChild(n); }
      b.appendChild(t); b.appendChild(m);
      b.addEventListener('click', function () { onTap(s, b); });
      li.appendChild(b); frag.appendChild(li);
    });
    ul.appendChild(frag);
    $('count').textContent = list.length + ' of ' + SONGS.length + ' songs';
  }

  function onTap(song, btn) {
    var now = Date.now(); if (now - lastTap < 500) return; lastTap = now;   // ignore double taps
    cancelPending();   // a pending tempo/start from the previous tap must never fire for the wrong song
    var out = usableOutput();
    if (!out) {
      connect();
      setMsg('Not sent — no BeatBuddy MIDI connection. ' + song.title + ' was NOT sent.', safeTab(song.tab || ''));
      return;
    }
    var r, auto = $('autostart').checked, sd = Number($('startdelay').value) || 600;
    var base = 'Sent: ' + song.title + ' → F' + song.folder + ' S' + song.songnum + (song.bpm ? ', ' + song.bpm + ' BPM' : '');
    try {
      r = tapSong(song, { out: out, win: window, setTimeout: setTimeout.bind(window), clearTimeout: clearTimeout.bind(window), ch: CH, delay: DELAY,
                          openTabs: $('opentabs').checked, autoStart: auto, startDelay: sd,
                          onStart: function () { if (pending === r) { pending = null; setMsg(base + ' · ▶ Start sent'); } } });
      pending = r;
    } catch (e) { setStatus('Send failed', 'err'); setMsg(String(e && e.message || e)); return; }
    Array.prototype.forEach.call(document.querySelectorAll('.song.sent'), function (x) { x.classList.remove('sent'); });
    btn.classList.add('sent');
    setMsg(base + (auto ? ' · starting in ' + r.startAt + ' ms' : '') +
           (r.tab ? (r.opened ? '' : ' · tab not opened (setting off)') : ' · no tab saved'), r.tab && !r.opened ? r.tab : null);
  }

  $('q').addEventListener('input', render);
  $('connect').addEventListener('click', connect);
  $('stop').addEventListener('click', function () {
    cancelPending();
    var out = usableOutput();
    if (!out) { connect(); setMsg('Stop NOT sent — no BeatBuddy MIDI connection.'); return; }
    try { out.send(STOP); setMsg('■ Stop sent (MIDI Stop 0xFC)'); } catch (e) { setStatus('Send failed', 'err'); setMsg(String(e && e.message || e)); }
  });
  $('outputs').addEventListener('change', function () { userPicked = true; showConn(); });
  render();
  connect();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
