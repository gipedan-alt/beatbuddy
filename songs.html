<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatBuddy Songbook</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background:#111; color:#eee; }
  header { position:sticky; top:0; z-index:2; background:#111; padding:10px 10px 8px; border-bottom:1px solid #333; }
  #bar { display:flex; gap:6px; align-items:center; }
  #status { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:17px; font-weight:700; padding:10px 12px; border-radius:12px; background:#333; min-height:48px;
            display:flex; align-items:center; }
  #status.ok { background:#1b5e20; } #status.warn { background:#8a6d00; } #status.err { background:#8b1a1a; }
  #connect { font-size:17px; font-weight:700; padding:12px 12px; white-space:nowrap; border-radius:12px; border:0; background:#1565c0; color:#fff; min-height:48px; }
  #q { width:100%; margin-top:8px; font-size:20px; padding:12px 14px; border-radius:12px; border:1px solid #444; background:#1d1d1d; color:#fff; }
  #msg { font-size:16px; margin-top:6px; color:#ddd; white-space:pre-line; }
  #msg a { color:#ffb74d; font-weight:700; }
  #opts { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; font-size:15px; color:#aaa; }
  #outputs { font-size:15px; padding:6px; border-radius:8px; max-width:60vw; }
  #list { list-style:none; margin:0; padding:6px 8px 40px; }
  #list li { margin:0 0 6px; }
  .song { width:100%; text-align:left; border:0; border-radius:14px; background:#222; color:#eee; padding:14px 14px; min-height:64px;
          display:block; font:inherit; cursor:pointer; }
  .song:active { background:#0d47a1; }
  .bpm-ctl { display:flex; align-items:center; gap:6px; margin-top:6px; }
  .bpm-ctl button { font-size:18px; font-weight:700; width:36px; height:36px; border-radius:8px; border:0; background:#1565c0; color:#fff; padding:0; }
  .bpm-ctl button:active { background:#0d47a1; }
  .bpm-val { font-size:16px; font-weight:700; min-width:48px; text-align:center; }
  .song.sent { background:#1b5e20; }
  .t { font-size:21px; font-weight:700; display:block; }
  .m { font-size:14px; color:#aaa; display:block; margin-top:3px; }
  .notab { color:#ffb74d; }
  #count { font-size:13px; color:#888; padding:0 12px; }
  #startdelay { font-size:15px; padding:6px; border-radius:8px; }
  #startdelay:disabled { opacity:.5; }
  #stop, #start { font-size:17px; font-weight:700; padding:12px 12px; border-radius:12px; border:0; color:#fff; min-height:48px; min-width:48px; white-space:nowrap; }
  #stop { background:#b71c1c; }
  #stop:active { background:#7f0000; }
  #start { background:#2e7d32; }
  #start:active { background:#1b5e20; }
  #start.off { opacity:.45; filter:grayscale(.6); }
  .stopnote { font-size:12px; color:#ef9a9a; }
  .startnote { font-size:12px; color:#a5d6a7; }
  @media (max-width:520px) { #bar #stop, #bar #start, #bar #connect { font-size:16px; padding:12px 9px; } }
</style>
</head>
<body>
<header>
  <div id="bar"><div id="status">Starting…</div><button id="connect" type="button">Connect MIDI</button><button id="stop" type="button" title="Sends MIDI Stop (0xFC) — stops immediately">■ Stop beat</button><button id="start" type="button" class="off" title="Sends CC114 = 1 — starts the loaded song">▶ Start beat</button></div>
  <input id="q" type="search" placeholder="Search songs, artists, beats…" autocomplete="off">
  <div id="msg"></div>
  <div id="opts">
    <label>Output <select id="outputs"><option value="">(no MIDI outputs yet)</option></select></label>
    <label><input type="checkbox" id="opentabs" checked> Open tab on tap</label>
    <label><input type="checkbox" id="autostart"> Auto-start beat</label>
    <label>Start after <select id="startdelay">
      <option value="300">300 ms</option><option value="600" selected>600 ms</option><option value="1000">1000 ms</option>
      <option value="1500">1500 ms</option><option value="2000">2000 ms</option></select></label>
    <span class="stopnote">■ Stop beat stops immediately</span>
    <span class="startnote">▶ Start beat starts the loaded song</span>
  </div>
</header>
<div id="count"></div>
<ul id="list"></ul>
