<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatBuddy Song Select</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background:#111; color:#eee;
         display:flex; flex-direction:column; align-items:center; padding:16px; gap:14px; text-align:center; }
  #song { font-size: clamp(28px, 8vw, 56px); font-weight:700; margin-top:8px; word-break:break-word; }
  #target { font-size: clamp(18px, 4.5vw, 28px); color:#aaa; }
  #status { font-size: clamp(26px, 7vw, 48px); font-weight:800; padding:18px 22px; border-radius:16px;
            width:100%; max-width:820px; box-sizing:border-box; background:#333; }
  #status.ok   { background:#1b5e20; }
  #status.warn { background:#8a6d00; }
  #status.err  { background:#8b1a1a; }
  #detail { font-size: clamp(15px, 3.6vw, 20px); color:#ccc; max-width:820px; white-space:pre-line; }
  button { font-size: clamp(24px, 6vw, 40px); font-weight:700; padding:22px 40px; border-radius:18px; border:0;
           background:#1565c0; color:#fff; width:100%; max-width:820px; }
  button:active { background:#0d47a1; }
  select { font-size: clamp(18px, 4.5vw, 24px); padding:10px; border-radius:10px; width:100%; max-width:820px; }
  #log { font: 13px/1.4 ui-monospace, monospace; color:#8f8; text-align:left; max-width:820px; width:100%;
         white-space:pre-wrap; background:#000; padding:8px; border-radius:8px; box-sizing:border-box; }
  label { font-size: 16px; color:#aaa; }
  #opentab { display:none; box-sizing:border-box; font-size: clamp(24px, 6vw, 40px); font-weight:700; padding:22px 40px;
             border-radius:18px; background:#ef6c00; color:#fff; width:100%; max-width:820px; text-decoration:none; }
  #opentab:active { background:#e65100; }
  #tabnote { font-size: clamp(14px, 3.4vw, 18px); color:#ffcc80; max-width:820px; }
</style>
</head>
<body>
  <div id="song">BeatBuddy</div>
  <div id="target"></div>
  <div id="status">Starting…</div>
  <div id="detail"></div>
  <a id="opentab" href="#" rel="noopener">Open tab</a>
  <div id="tabnote"></div>
  <button id="send" type="button">Send again</button>
  <label for="outputs">MIDI output</label>
  <select id="outputs"><option value="">(no MIDI outputs yet)</option></select>
  <div id="log"></div>

<script>
/*
 * BeatBuddy song select via Web MIDI (Android Chrome + CME WIDI Master).
 *
 * URL parameters:
 *   song=Name      label shown on screen (optional)
 *   folder=N       BeatBuddy folder number, 1-based as shown on the pedal / BeatBuddy Manager (required)
 *   songnum=N      song number inside that folder, 1-based (required)
 *   bpm=N          optional tempo 40-300; sent as CC106 (MSB) + CC107 (LSB) after the song loads
 *   ch=N           MIDI channel 1-16 (default 1; BeatBuddy MIDI-In default is OMNI so any works)
 *   bank=N         Bank MSB (CC0) value 0-127 (default 0; only needed past folder 128)
 *   delay=MS       wait between Program Change and tempo (default 400 ms) so the song is loaded first
 *   out=TEXT       prefer the output whose name contains TEXT (default "WIDI")
 *   auto=0         don't send automatically on load; wait for the button
 *   start=1        OPTIONAL auto-start (off by default): after the song (and tempo) are sent, also send
 *                  CC114 value 1 ("Start - starts the playback of the current song") so the beat begins.
 *   startdelay=MS  wait before the start command, 100-5000 (clamped; default 600). Counted from the tempo
 *                  message; with no bpm= it is counted from the song select plus delay= (default 400+600 = 1000 ms).
 *   tab=URL        optional chord/tab link (URL-encoded http/https, e.g. Ultimate Guitar). Shows a big "Open tab" button.
 *   tabmode=MODE   what happens with tab= (default "same"):
 *                    same   - after the first successful send (song + tempo, then ~300 ms) this tab is replaced by
 *                             the tab URL (location.replace: no user gesture needed, and Back skips this page so
 *                             it can't loop). If MIDI fails, no redirect: the error and the Open tab button stay.
 *                    new    - never leaves this page; "Open tab" (and tapping "Send again") open the tab in a new tab.
 *                    button - never redirects; "Open tab" opens it in this tab.
 *
 * BeatBuddy MIDI (manual fw 4.1.3, "Folder/Song Select" + "Tempo Control"):
 *   Bn 00 MSB   Bank Select MSB (CC0)
 *   Bn 20 LSB   Bank Select LSB (CC32) = folder - 1
 *   Cn PC       Program Change = song - 1   (the song only changes when PC arrives)
 *   Bn 6A msb   CC106 Tempo MSB = floor(bpm/128)
 *   Bn 6B lsb   CC107 Tempo LSB = bpm % 128  (tempo updates when LSB arrives)
 *   Bn 72 01    CC114 value 1 = Start playback of the current song (only with start=1). Follows the pedal's
 *               Intro setting: with Intro = None the beat starts straight away, otherwise the intro plays first.
 */
(function (global) {
  'use strict';

  var START_DELAY_DEFAULT = 600, START_DELAY_MIN = 100, START_DELAY_MAX = 5000;

  function intParam(params, name, def) {
    var v = params.get(name);
    if (v === null || v.trim() === '') return def;
    var n = Number(v.trim());
    return Number.isInteger(n) ? n : NaN;
  }

  // Pure function: parse + validate URL params. Returns {cfg, errors}.
  function parseConfig(search) {
    var p = new URLSearchParams(search || '');
    var cfg = {
      song: (p.get('song') || '').trim(),
      folder: intParam(p, 'folder', null),
      songnum: intParam(p, 'songnum', null),
      bpm: intParam(p, 'bpm', null),
      ch: intParam(p, 'ch', 1),
      bank: intParam(p, 'bank', 0),
      delay: intParam(p, 'delay', 400),
      out: (p.get('out') || 'WIDI').trim(),
      auto: p.get('auto') !== '0',
      start: /^(1|true|yes|on)$/i.test((p.get('start') || '').trim()),
      startdelay: intParam(p, 'startdelay', START_DELAY_DEFAULT),
      tab: null,
      tabmode: 'same',
      tabError: null
    };
    var tabRaw = (p.get('tab') || '').trim();
    if (tabRaw) {
      var u = null;
      try { u = new URL(tabRaw); } catch (e) { u = null; }
      if (u && (u.protocol === 'https:' || u.protocol === 'http:')) cfg.tab = u.href;
      else cfg.tabError = 'tab= is not an http(s) link, ignored.';
    }
    var tm = (p.get('tabmode') || '').trim().toLowerCase();
    if (tm === 'new' || tm === 'same' || tm === 'button') cfg.tabmode = tm;
    var errors = [];
    if (cfg.folder === null) errors.push('Missing folder= (BeatBuddy folder number, starting at 1).');
    else if (!(cfg.folder >= 1 && cfg.folder <= 128)) errors.push('folder must be a whole number 1-128.');
    if (cfg.songnum === null) errors.push('Missing songnum= (song number in the folder, starting at 1).');
    else if (!(cfg.songnum >= 1 && cfg.songnum <= 128)) errors.push('songnum must be a whole number 1-128.');
    if (cfg.bpm !== null && !(cfg.bpm >= 40 && cfg.bpm <= 300)) errors.push('bpm must be a whole number 40-300 (or left blank).');
    if (!(cfg.ch >= 1 && cfg.ch <= 16)) errors.push('ch must be 1-16.');
    if (!(cfg.bank >= 0 && cfg.bank <= 127)) errors.push('bank must be 0-127.');
    if (!(cfg.delay >= 0 && cfg.delay <= 5000)) cfg.delay = 400;
    if (!Number.isInteger(cfg.startdelay)) cfg.startdelay = START_DELAY_DEFAULT;
    cfg.startdelay = Math.min(START_DELAY_MAX, Math.max(START_DELAY_MIN, cfg.startdelay));
    return { cfg: cfg, errors: errors };
  }

  // Pure function: the exact MIDI messages to send, in order.
  function buildMessages(cfg) {
    var c = cfg.ch - 1;
    var msgs = [
      { label: 'Bank MSB CC0=' + cfg.bank, bytes: [0xB0 | c, 0x00, cfg.bank], delayAfter: 0 },
      { label: 'Bank LSB CC32=' + (cfg.folder - 1) + ' (folder ' + cfg.folder + ')', bytes: [0xB0 | c, 0x20, cfg.folder - 1], delayAfter: 0 },
      { label: 'Program Change ' + (cfg.songnum - 1) + ' (song ' + cfg.songnum + ')', bytes: [0xC0 | c, cfg.songnum - 1], delayAfter: cfg.bpm !== null ? cfg.delay : 0 }
    ];
    if (cfg.bpm !== null) {
      var msb = Math.floor(cfg.bpm / 128), lsb = cfg.bpm % 128;
      msgs.push({ label: 'Tempo MSB CC106=' + msb, bytes: [0xB0 | c, 106, msb], delayAfter: 0 });
      msgs.push({ label: 'Tempo LSB CC107=' + lsb + ' (' + cfg.bpm + ' BPM)', bytes: [0xB0 | c, 107, lsb], delayAfter: 0 });
    }
    if (cfg.start) {
      // Start goes LAST: startdelay after the tempo LSB, or (no bpm) delay + startdelay after the Program Change.
      var last = msgs[msgs.length - 1];
      last.delayAfter = cfg.bpm !== null ? cfg.startdelay : cfg.delay + cfg.startdelay;
      msgs.push({ label: 'Start CC114=1 (play)', bytes: [0xB0 | c, 114, 1], delayAfter: 0 });
    }
    return msgs;
  }

  function hex(bytes) {
    return bytes.map(function (b) { return b.toString(16).toUpperCase().padStart(2, '0'); }).join(' ');
  }

  // Choose an output: one whose name contains `pref` (case-insensitive), else the only one, else first.
  function pickOutput(outputs, pref) {
    if (!outputs.length) return null;
    var want = (pref || '').toLowerCase();
    if (want) {
      for (var i = 0; i < outputs.length; i++) {
        if ((outputs[i].name || '').toLowerCase().indexOf(want) !== -1) return outputs[i];
      }
    }
    return outputs[0];
  }

  // Pure function: should this page replace itself with the tab after a send? And after how long?
  // Returns ms to wait after the LAST MIDI message (the start CC114 with start=1, else the tempo LSB, or the
  // Program Change if no bpm), or null. send() only redirects after every message, incl. the start, has gone out.
  var TAB_AFTER_MS = 300;
  function redirectPlan(cfg) {
    if (!cfg.tab || cfg.tabmode !== 'same') return null;
    return TAB_AFTER_MS;
  }

  var api = { parseConfig: parseConfig, buildMessages: buildMessages, pickOutput: pickOutput, hex: hex,
              redirectPlan: redirectPlan, TAB_AFTER_MS: TAB_AFTER_MS,
              START_DELAY_DEFAULT: START_DELAY_DEFAULT, START_DELAY_MIN: START_DELAY_MIN, START_DELAY_MAX: START_DELAY_MAX };
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; return; }
  global.BBMidi = api;

  // ---------------- Browser UI ----------------
  var $ = function (id) { return document.getElementById(id); };
  var parsed = parseConfig(location.search);
  var cfg = parsed.cfg;
  var access = null, outputs = [], sentOnce = false, sending = false, userPicked = false, redirected = false;
  function isPreferred(o) { return !!o && (o.name || '').toLowerCase().indexOf((cfg.out || '').toLowerCase()) !== -1; }

  function setStatus(text, cls, detail) {
    $('status').textContent = text;
    $('status').className = cls || '';
    if (detail !== undefined) $('detail').textContent = detail;
  }
  function log(line) {
    var t = new Date().toLocaleTimeString();
    $('log').textContent = '[' + t + '] ' + line + '\n' + $('log').textContent;
  }

  $('song').textContent = cfg.song || 'BeatBuddy';
  if (cfg.tab) {
    var a = $('opentab');
    a.href = cfg.tab;
    a.style.display = 'block';
    if (cfg.tabmode === 'new') { a.target = '_blank'; a.textContent = 'Open tab (new tab)'; }
    $('tabnote').textContent = cfg.tabmode === 'same' ? 'The tab opens here automatically once the song' + (cfg.bpm !== null ? ', tempo' : '') +
      (cfg.start ? ' and start' : '') + ' are sent.' : '';
  } else if (cfg.tabError) {
    $('tabnote').textContent = cfg.tabError;
  }
  if (parsed.errors.length === 0) {
    $('target').textContent = 'Folder ' + cfg.folder + ' · Song ' + cfg.songnum +
      (cfg.bpm !== null ? ' · ' + cfg.bpm + ' BPM' : '') + ' · Ch ' + cfg.ch + (cfg.start ? ' · Auto\u2011start' : '');
    document.title = (cfg.song || 'BeatBuddy') + ' → BeatBuddy';
  }

  function refreshOutputs() {
    outputs = [];
    if (access) access.outputs.forEach(function (o) { if (o.state !== 'disconnected') outputs.push(o); });
    var sel = $('outputs'), prev = sel.value;
    sel.innerHTML = '';
    if (!outputs.length) {
      sel.innerHTML = '<option value="">(no MIDI outputs found)</option>';
      return null;
    }
    var preferred = pickOutput(outputs, cfg.out);
    outputs.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.id; opt.textContent = o.name + (o.manufacturer ? ' (' + o.manufacturer + ')' : '');
      sel.appendChild(opt);
    });
    // Keep the user's manual choice unless a preferred (e.g. WIDI) output just appeared.
    var keep = outputs.some(function (o) { return o.id === prev; }) && (userPicked || !isPreferred(preferred));
    sel.value = keep ? prev : preferred.id;
    return preferred;
  }

  function currentOutput() {
    var id = $('outputs').value;
    for (var i = 0; i < outputs.length; i++) if (outputs[i].id === id) return outputs[i];
    return null;
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function send() {
    if (sending) return;
    if (parsed.errors.length) { setStatus('Link is missing info', 'err', parsed.errors.join('\n')); return; }
    if (!access) { await init(); if (!access) return; }
    refreshOutputs();
    var out = currentOutput();
    if (!out) {
      setStatus('No MIDI device found', 'err',
        'Connect WIDI Master in the free "MIDI BLE Connect" app (Bluetooth Scan → WIDI Master), ' +
        'press Home (not Back) to leave it running, then come back and tap Send again.');
      return;
    }
    sending = true;
    try {
      var msgs = buildMessages(cfg);
      setStatus('Sending…', 'warn', 'To: ' + out.name + (cfg.start ? '\nBeat starts in a moment…' : ''));
      for (var i = 0; i < msgs.length; i++) {
        out.send(msgs[i].bytes);
        log('→ ' + out.name + ': ' + hex(msgs[i].bytes) + '   ' + msgs[i].label);
        if (msgs[i].delayAfter) await sleep(msgs[i].delayAfter);
      }
      sentOnce = true;
      var wait = redirectPlan(cfg);
      if (wait !== null && !redirected) {
        redirected = true;
        $('tabnote').textContent = 'Opening tab…';
        setTimeout(function () { location.replace(cfg.tab); }, wait);
      }
      setStatus(cfg.start ? '✓ Sent + started' : '✓ Sent to BeatBuddy', 'ok',
        (cfg.song ? cfg.song + '\n' : '') + 'Folder ' + cfg.folder + ', Song ' + cfg.songnum +
        (cfg.bpm !== null ? ', ' + cfg.bpm + ' BPM' : '') + (cfg.start ? '\nStart (CC114) sent' : '') + '\nvia ' + out.name +
        (!isPreferred(out) ? '\n⚠ This is not a "' + cfg.out + '" device — pick the right output above if needed.' : ''));
    } catch (e) {
      setStatus('Send failed', 'err', String(e && e.message || e));
      log('ERROR ' + e);
    } finally { sending = false; }
  }

  async function init() {
    if (parsed.errors.length) { setStatus('Link is missing info', 'err', parsed.errors.join('\n')); return; }
    if (!window.isSecureContext) { setStatus('Needs HTTPS', 'err', 'Web MIDI only works on an https:// page.'); return; }
    if (!navigator.requestMIDIAccess) {
      setStatus('Web MIDI not available', 'err', 'Open this link in Chrome on Android (not Firefox/Samsung Internet/iPhone).');
      return;
    }
    setStatus('Asking for MIDI permission…', 'warn', 'If Chrome asks to "connect to MIDI devices", tap Allow.');
    try {
      access = await navigator.requestMIDIAccess({ sysex: false });
    } catch (e) {
      setStatus('MIDI permission blocked', 'err',
        'Chrome menu ⋮ → Settings → Site settings → MIDI devices → allow this site, then reload.\n(' + (e && e.name || e) + ')');
      return;
    }
    access.onstatechange = function (ev) {
      log('device ' + ev.port.type + ' "' + ev.port.name + '" ' + ev.port.state);
      var pref = refreshOutputs();
      // If the WIDI shows up after the page opened, send automatically once.
      if (!sentOnce && cfg.auto && isPreferred(pref) && ev.port.type === 'output' && ev.port.state === 'connected') send();
    };
    var pref = refreshOutputs();
    log('outputs: ' + (outputs.map(function (o) { return o.name; }).join(', ') || 'none'));
    if (!pref) {
      setStatus('No MIDI device found', 'err',
        'Connect WIDI Master in the free "MIDI BLE Connect" app (Bluetooth Scan → WIDI Master), ' +
        'press Home (not Back) to leave it running, then come back. This page will send as soon as it appears.');
      return;
    }
    if (!isPreferred(pref)) {
      setStatus('"' + cfg.out + '" not connected yet', 'warn',
        'Found: ' + outputs.map(function (o) { return o.name; }).join(', ') +
        '\nConnect WIDI Master in "MIDI BLE Connect" (this page sends automatically when it appears), ' +
        'or pick an output above and tap Send again.');
      return;
    }
    if (cfg.auto) await send();
    else setStatus('Ready — tap Send', 'warn', 'Output: ' + pref.name);
  }

  $('send').addEventListener('click', function () {
    // tabmode=new: this tap is a user gesture, so a new tab is allowed (open it before the async send).
    if (cfg.tab && cfg.tabmode === 'new' && parsed.errors.length === 0) window.open(cfg.tab, '_blank', 'noopener');
    send();
  });
  $('outputs').addEventListener('change', function () { userPicked = true; log('selected output: ' + (currentOutput() || {}).name); });
  init();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
